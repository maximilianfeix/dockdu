name: release

on:
  push:
    tags: ["v*"]

# Nothing by default; the one job below asks for exactly what it needs.
permissions: {}

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # GitHub release
      packages: write   # ghcr.io image
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # Fail before anything is published when the tap token cannot write to
      # the Homebrew tap. The probe is a PUT without a content field: GitHub
      # answers 403/404 when the token lacks access and 422 (validation)
      # when it has write permission. Nothing is written either way.
      - name: preflight, tap token can write to maximilianfeix/homebrew-tap
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
        run: |
          test -n "$TAP_TOKEN" || { echo "::error::HOMEBREW_TAP_GITHUB_TOKEN is not set"; exit 1; }
          code=$(curl -s -o /tmp/preflight.json -w '%{http_code}' -X PUT \
            -H "Authorization: Bearer $TAP_TOKEN" -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/maximilianfeix/homebrew-tap/contents/Casks/.preflight \
            -d '{"message":"preflight"}')
          if [ "$code" != "422" ]; then
            echo "::error::tap token cannot write to maximilianfeix/homebrew-tap (HTTP $code): $(jq -r .message /tmp/preflight.json 2>/dev/null)"
            exit 1
          fi
          echo "tap token has write access (validation error as expected, nothing written)"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Token with contents:write on maximilianfeix/homebrew-tap; set as a repository secret.
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
